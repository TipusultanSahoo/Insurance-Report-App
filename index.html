<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Insurance Report Generation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

    <div class="card main-card">

        <div class="card-header">
            Insurance Report Generation
        </div>

        <div class="card-body">

            <!-- SEARCH FORM -->
            <div class="row">

                <!-- PLAN NAME -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        Plan Name
                    </label>

                    <select class="form-select"
                            id="planName">

                        <option value="">
                            - Select -
                        </option>

                    </select>

                </div>

                <!-- PLAN STATUS -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        Plan Status
                    </label>

                    <select class="form-select"
                            id="planStatus">

                        <option value="">
                            - Select -
                        </option>

                    </select>

                </div>

                <!-- GENDER -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        Gender
                    </label>

                    <select class="form-select"
                            id="gender">

                        <option value="">
                            - Select -
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                    </select>

                </div>

                <!-- START DATE -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        Start Date
                    </label>

                    <input type="date"
                           class="form-control"
                           id="startDate">

                </div>

                <!-- END DATE -->
                <div class="col-md-4 mb-3">

                    <label class="form-label fw-bold">
                        End Date
                    </label>

                    <input type="date"
                           class="form-control"
                           id="endDate">

                </div>

                <!-- SEARCH BUTTON -->
                <div class="col-md-4">

                    <button class="btn btn-primary search-btn"
                            onclick="searchReports()">

                        <i class="bi bi-search"></i>

                        Search

                    </button>

                </div>

            </div>

            <!-- RESULTS TABLE -->
            <div class="table-section">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead>

                        <tr>

                            <th>Citizen Name</th>
                            <th>Gender</th>
                            <th>Plan Name</th>
                            <th>Status</th>
                            <th>Benefit Amount</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Denial Reason</th>

                        </tr>

                        </thead>

                        <tbody id="reportTableBody">

                        <tr>

                            <td colspan="8"
                                class="no-data">

                                Search results will display here

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

            <!-- EXPORT BUTTONS -->
            <div class="export-section">

                <button class="btn btn-success export-btn"
                        onclick="downloadExcel()">

                    <i class="bi bi-file-earmark-excel-fill"></i>

                    Export Excel

                </button>

                <button class="btn btn-danger export-btn"
                        onclick="downloadPdf()">

                    <i class="bi bi-file-earmark-pdf-fill"></i>

                    Export PDF

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="js/app.js"></script>

</body>
</html>
